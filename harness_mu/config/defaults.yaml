default_model:
  provider: openai
  model: deepseek-chat
  temperature: 0.0
  max_retries: 3

module_models:
  mediator:
    provider: openai
    model: deepseek-chat
    temperature: 0.0
  worker:
    provider: openai
    model: deepseek-chat
    temperature: 0.7

scenarios:
  instruction_following:
    enabled: true
    data_file: data/scenarios/multiuser_instruction_following/data_builder/controlled_exp/aligned_2_to_10.jsonl
    modules:
      gatekeeper: false
      mediator: true
      worker: true
      compliance_checker: false

output:
  results_dir: results
  save_raw: true
  save_metrics: true

execution:
  max_workers: 16
  debug: false
