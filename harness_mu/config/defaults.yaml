default_model:
  provider: openai
  model: deepseek-v4-pro
  temperature: 0.0
  max_retries: 3
  max_tokens: 4096

module_models:
  mediator:
    provider: openai
    model: deepseek-v4-pro
    temperature: 0.0
    max_tokens: 4096
  worker:
    provider: openai
    model: deepseek-v4-pro
    temperature: 0.7
    max_tokens: 16384

scenarios:
  instruction_following:
    enabled: true
    data_file: data/instruction_following/aligned_2_to_10.jsonl
    modules:
      gatekeeper: false
      mediator: true
      worker: true
      compliance_checker: true
  access_control:
    enabled: false
    data_file: data/access_control/none_sample.jsonl
    modules:
      gatekeeper: true
      mediator: true
      worker: true
      compliance_checker: true

output:
  results_dir: results
  save_raw: true
  save_metrics: true

execution:
  max_workers: 16
  debug: false
